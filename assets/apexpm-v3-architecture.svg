<text x="1024.0" y="995" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4049" >ACTIVE → QUARANTINE automatically when losing beyond noise</text>
<text x="1024.0" y="1016" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4049" >QUARANTINE → ACTIVE only by a human</text>
<line x1="379" y1="886" x2="379" y2="937" stroke="#5b7a99" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="690" y1="994" x2="717" y2="994" stroke="#5b7a99" stroke-width="2.5" marker-end="url(#ah)"/>
