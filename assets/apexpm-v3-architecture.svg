<rect x="69" y="790" width="621" height="96" rx="10" fill="#ecebe6" stroke="#8a8578" stroke-width="2"/>
<text x="379.5" y="820" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1d1f24" >5 · Journal</text>
<text x="379.5" y="846" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4049" >every trade, fill, plan, scan</text>
