<text x="1024.0" y="846" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4049" >phone-first web app: positions, activity,</text>
<text x="1024.0" y="867" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4049" >analytics, reports, manual trading · secure pairing</text>
