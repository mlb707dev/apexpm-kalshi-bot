<text x="1372" y="760" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b4049" transform="rotate(-90 1372 760)">lifecycle sets the gate</text>
<rect x="69" y="1089" width="1260" height="110" rx="10" fill="#eaf3ea" stroke="#2f7d4f" stroke-width="2"/>
<text x="699.0" y="1119" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1d1f24" >9 · The Lab — strategy R&amp;D</text>
<text x="699.0" y="1145" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4049" >variants: same strategy code, different settings, tested in the shadow book · scoreboard: variant vs base</text>
<text x="699.0" y="1166" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4049" >tune · retire · spawn — strategy changes arrive only as evidence-backed proposals</text>
<text x="699.0" y="1187" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7078" >proposals go to the owner; nothing is applied automatically — the bot stays deterministic</text>
<line x1="379" y1="1049" x2="379" y2="1087" stroke="#5b7a99" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="1024" y1="1049" x2="1024" y2="1087" stroke="#5b7a99" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M1329,1144 L1423,1144 L1423,528 L973,528" fill="none" stroke="#2f7d4f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ahg)"/>
<text x="1410" y="760" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#2f7d4f" transform="rotate(-90 1410 760)">approved proposals → new rules at the gate</text>
<rect x="69" y="1239" width="1260" height="120" rx="10" fill="#f3eef7" stroke="#7a5b99" stroke-width="2"/>
<text x="699.0" y="1269" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1d1f24" >10 · Daily audit — the build&#x27;s independent reviewer, outside the bot</text>
<text x="699.0" y="1295" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4049" >a fresh session reads the nightly research bundle, the code, every spec and yesterday&#x27;s audit · re-derives formulas · checks caps, exits, lifecycle, Lab, fills, fees, infra</text>
<text x="699.0" y="1316" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3b4049" >ships correctness and infra fixes with tests · writes an audit file · anything that changes money behavior becomes a proposal with the diff ready</text>
<text x="699.0" y="1337" text-anchor="middle" font-family="Inter, 'IBM Plex Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7078" >holds no token and no key: it can read and propose, never trade · a separate health alert watches the service every 10 minutes</text>
<line x1="699" y1="1199" x2="699" y2="1237" stroke="#7a5b99" stroke-width="2.5" marker-end="url(#ah)"/>
